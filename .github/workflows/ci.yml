name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17]
        app: [katalon, vwo, orangehrm]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test ${{ matrix.app }}
        run: |
          mvn clean test -Dapp=${{ matrix.app }} -Denv=qa -Dsurefire.suiteXmlFiles=testng_${{ matrix.app }}.xml
        env:
          # Set test credentials for VWO and OrangeHRM (using test values)
          VWO_USERNAME: ${{ secrets.VWO_USERNAME || 'testuser' }}
          VWO_PASSWORD: ${{ secrets.VWO_PASSWORD || 'testpass' }}
          VWO_INVALID_USERNAME: ${{ secrets.VWO_INVALID_USERNAME || 'invaliduser' }}
          VWO_INVALID_PASSWORD: ${{ secrets.VWO_INVALID_PASSWORD || 'invalidpass' }}
          OHR_USERNAME: ${{ secrets.OHR_USERNAME || 'testuser' }}
          OHR_PASSWORD: ${{ secrets.OHR_PASSWORD || 'testpass' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.app }}-java${{ matrix.java-version }}
          path: target/surefire-reports/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.app }}-java${{ matrix.java-version }}
          path: target/site/allure-maven-plugin/

  docker-grid-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start Selenium Grid with Docker Compose
        run: |
          docker compose up -d || docker-compose up -d
          # Wait for grid to be ready
          sleep 10

      - name: Run Docker Grid Tests
        run: |
          mvn clean test -Dsurefire.suiteXmlFiles=testng_docker_grid.xml

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down || docker-compose down

      - name: Upload Docker Grid Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-grid-test-results
          path: target/surefire-reports/

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Checkstyle Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-results
          path: target/checkstyle-result.xml

      - name: Upload OWASP Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.xml
